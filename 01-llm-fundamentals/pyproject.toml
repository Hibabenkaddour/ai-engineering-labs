[project]
name = "task-extractor-lab"
version = "0.1.0"
description = "Lab 01: a minimal LLM request with a testable mocked client"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<4",
    "pydantic>=2.14.0",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
